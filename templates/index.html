<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sudoku Solver</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="icon" href="{{ url_for('static', filename='images/favicon.ico') }}" type="image/x-icon">
</head>
<body>
    <div class="container">
        <h1>Sudoku Solver</h1>
        <div id="message">Enter your puzzle and click "Solve"</div>
        <div class="sudoku-grid" id="grid"></div>
        <div class="buttons">
            <button id="solve-btn" onclick="solveSudoku()">Solve</button>
            <button id="clear-btn" onclick="clearGrid()">Clear</button>
            <button id="exit-btn" onclick="window.close()">Exit</button>
        </div>
    </div>

    <script src="{{ url_for('static', filename='scripts/scripts.js') }}"></script>
</body>
</html>
